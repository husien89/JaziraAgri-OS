name: Build and Release Flet APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flet
        run: pip install "flet[all]==0.27.6"

      - name: Build APK
        run: flet build apk -v

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find build -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "Found: $APK"
          ls -lh "$APK"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          # اسم الملف اللي رح يظهر بالـ Release
          # اذا بدك اسم ثابت غيره هون
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
